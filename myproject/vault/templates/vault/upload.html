{% extends 'vault/base.html' %}

{% block content %}
<h2>Upload New Document</h2>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div style="margin-bottom: 15px;">
        <label>Document Title</label><br>
        <input type="text" name="title" required style="width: 100%; padding: 8px; margin-top: 5px;">
    </div>
    <div style="margin-bottom: 15px;">
        <label>Category</label><br>
        <input type="text" name="category" placeholder="e.g. Legal, Finance, HR" required style="width: 100%; padding: 8px; margin-top: 5px;">
    </div>
    <div style="margin-bottom: 15px;">
        <label>Select File</label><br>
        <input type="file" name="file" required style="margin-top: 5px;">
    </div>
    <button type="submit" class="btn">Upload Document</button>
</form>
{% endblock %}
