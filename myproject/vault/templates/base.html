<!DOCTYPE html>
<html>
<head>
    <title>TrustVault</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        header { display: flex; justify-content: space-between; align-items: center; background: #333; color: #fff; padding: 10px 20px; }
        header a { color: #fff; text-decoration: none; margin-left: 15px; }
        .container { margin-top: 20px; background: #fff; padding: 20px; border-radius: 8px; }
        .btn { background: #28a745; color: white; padding: 8px 12px; text-decoration: none; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>TrustVault</h1>
        <nav>
            {% if user.is_authenticated %}
                <span>Welcome, {{ user.username }}</span>
                <a href="{% url 'dashboard' %}">Dashboard</a>
                <a href="{% url 'upload_doc' %}">Upload</a>
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
            {% endif %}
        </nav>
    </header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
